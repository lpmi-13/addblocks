<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Add Blocks — feel the maths">
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#F7F9FA"/>
      <stop offset="1" stop-color="#E5F0F5"/>
    </linearGradient>
    <linearGradient id="block" x2="0" y2="1">
      <stop stop-color="#B1DAEB"/>
      <stop offset="1" stop-color="#91C7DF"/>
    </linearGradient>
    <g id="filled-cell">
      <rect width="26" height="26" rx="5" fill="url(#block)" stroke="#4E91B2" stroke-width="1.8"/>
      <path d="M4 22h18" stroke="#4E91B2" stroke-opacity=".25" stroke-width="2"/>
    </g>
    <g id="empty-cell">
      <rect width="26" height="26" rx="5" fill="#F9FCFD" stroke="#91A8B4" stroke-width="1.6" stroke-dasharray="4 3"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1168" cy="-90" r="335" fill="#DCECF3" opacity=".55"/>
  <circle cx="554" cy="673" r="240" fill="#FFFFFF" opacity=".35"/>

  <!-- A small version of the stacked trays in the activity. -->
  <rect x="78" y="72" width="54" height="54" rx="15" fill="#FFFFFF" stroke="#D5E5EC"/>
  <rect x="88" y="81" width="35" height="15" rx="4" fill="#EEF3F5"/>
  <rect x="88" y="102" width="35" height="15" rx="4" fill="#EEF3F5"/>
  <g fill="#91C7DF" stroke="#4E91B2" stroke-width="1.2">
    <rect x="92" y="84" width="8" height="8" rx="2"/>
    <rect x="103" y="84" width="8" height="8" rx="2"/>
    <rect x="92" y="106" width="8" height="8" rx="2"/>
    <rect x="103" y="106" width="8" height="8" rx="2"/>
    <rect x="114" y="106" width="6" height="8" rx="2"/>
  </g>
  <rect x="114" y="84" width="6" height="8" rx="2" fill="none" stroke="#78909C" stroke-dasharray="2 2"/>
  <text x="151" y="111" fill="#17242B" font-family="DejaVu Sans, Segoe UI, sans-serif" font-size="36" font-weight="700" letter-spacing="-1.5">Add Blocks</text>

  <text x="81" y="213" fill="#4E91B2" font-family="DejaVu Sans, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="3">VISUAL PLACE-VALUE ADDITION</text>
  <text x="73" y="317" fill="#17242B" font-family="DejaVu Sans, Segoe UI, sans-serif" font-size="85" font-weight="700" letter-spacing="-5">feel the</text>
  <text x="73" y="415" fill="#246B8D" font-family="DejaVu Sans, Segoe UI, sans-serif" font-size="99" font-weight="700" letter-spacing="-6">maths</text>
  <text x="80" y="493" fill="#52656F" font-family="DejaVu Sans, Segoe UI, sans-serif" font-size="26">See numbers take shape.</text>
  <text x="80" y="531" fill="#52656F" font-family="DejaVu Sans, Segoe UI, sans-serif" font-size="26">Drag, group, understand.</text>

  <!-- The card is a simplified, static view of the real activity board. -->
  <rect x="647" y="82" width="478" height="503" rx="31" fill="#728E9C" opacity=".13"/>
  <rect x="637" y="70" width="478" height="503" rx="31" fill="#FFFFFF" stroke="#D5E4EA" stroke-width="2"/>
  <text x="697" y="131" fill="#17242B" font-family="DejaVu Sans, Segoe UI, sans-serif" font-size="32" font-weight="700">34 + 25</text>
  <path d="M696 150h361" stroke="#E4ECEF" stroke-width="2"/>
  <text x="812" y="184" fill="#52656F" font-family="DejaVu Sans, Segoe UI, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">TENS</text>
  <text x="960" y="184" fill="#52656F" font-family="DejaVu Sans, Segoe UI, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">ONES</text>

  <!-- Top number: three tens and four ones. -->
  <g>
    <use href="#filled-cell" x="782" y="201"/><use href="#filled-cell" x="814" y="201"/>
    <use href="#filled-cell" x="782" y="231"/><use href="#empty-cell" x="814" y="231"/>
    <use href="#empty-cell" x="782" y="261"/><use href="#empty-cell" x="814" y="261"/>
    <use href="#empty-cell" x="782" y="291"/><use href="#empty-cell" x="814" y="291"/>
    <use href="#empty-cell" x="782" y="321"/><use href="#empty-cell" x="814" y="321"/>
    <use href="#filled-cell" x="930" y="201"/><use href="#filled-cell" x="962" y="201"/>
    <use href="#filled-cell" x="930" y="231"/><use href="#filled-cell" x="962" y="231"/>
    <use href="#empty-cell" x="930" y="261"/><use href="#empty-cell" x="962" y="261"/>
    <use href="#empty-cell" x="930" y="291"/><use href="#empty-cell" x="962" y="291"/>
    <use href="#empty-cell" x="930" y="321"/><use href="#empty-cell" x="962" y="321"/>
  </g>

  <!-- Lower trays: two tens and five ones, filled from the bottom. -->
  <rect x="774" y="368" width="74" height="164" rx="13" fill="#EEF3F5" stroke="#E4ECEF"/>
  <rect x="922" y="368" width="74" height="164" rx="13" fill="#EEF3F5" stroke="#E4ECEF"/>
  <path d="M709 451h24m-12-12v24" stroke="#52656F" stroke-width="5" stroke-linecap="round"/>
  <g>
    <use href="#empty-cell" x="782" y="376"/><use href="#empty-cell" x="814" y="376"/>
    <use href="#empty-cell" x="782" y="406"/><use href="#empty-cell" x="814" y="406"/>
    <use href="#empty-cell" x="782" y="436"/><use href="#empty-cell" x="814" y="436"/>
    <use href="#empty-cell" x="782" y="466"/><use href="#empty-cell" x="814" y="466"/>
    <use href="#filled-cell" x="782" y="496"/><use href="#filled-cell" x="814" y="496"/>
    <use href="#empty-cell" x="930" y="376"/><use href="#empty-cell" x="962" y="376"/>
    <use href="#empty-cell" x="930" y="406"/><use href="#empty-cell" x="962" y="406"/>
    <use href="#filled-cell" x="930" y="436"/><use href="#empty-cell" x="962" y="436"/>
    <use href="#filled-cell" x="930" y="466"/><use href="#filled-cell" x="962" y="466"/>
    <use href="#filled-cell" x="930" y="496"/><use href="#filled-cell" x="962" y="496"/>
  </g>
</svg>
